# sdk-release.yml - SDK tag-push release lane (CICD design §2.2).
#
# Called by every SDK-repo caller (`release.yml`) on its tag prefix
# (sdk-v*, cron-sdk-v*, bank8-v*, …). Builds the tagged commit, then -
# only when the cascade GitHub App secrets are present - fans out a
# repository_dispatch to every consumer repo named in consumers.json.
# Without the App secrets the dispatch step is a documented no-op: the
# cascade is armed the day the operator creates the App (design §2.2,
# invariant).

name: sdk-release

on:
  workflow_call:
    inputs:
      # The SDK's full repo slug (e.g. `Sentin8/sentin8-sdk`). The bump
      # receiver rewrites EVERY pin line pointing at this repo (a
      # pinned workspace exports many crates under one tag).
      sdk-repo:
        description: 'SDK repository slug (owner/name)'
        required: true
        type: string
    secrets:
      SENTIN8_CI_APP_ID:
        description: 'Cascade GitHub App ID (empty = dispatch skipped)'
        required: false
      SENTIN8_CI_APP_PRIVATE_KEY:
        description: 'Cascade GitHub App private key (empty = dispatch skipped)'
        required: false


env:
  SQLX_OFFLINE: 'true'

jobs:
  release:
    # Job-level permissions CAP the token inside this reusable workflow
    # (the caller grant still cannot exceed it, so callers must ALSO
    # declare contents: write - both sides required: the caller grant
    # is the ceiling, this declaration the floor. Top-level `permissions:
    # contents: write` in a reusable workflow is REJECTED at cross-repo
    # call resolution: startup_failure).
    permissions:
      contents: write
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout (tagged commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v7.0.1

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      - name: Build + test the tagged release
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked

      # ── GitHub Release (single-repo scope, GITHUB_TOKEN) ───────
      # The tag itself is the source of truth; the Release is the
      # presentation layer (CICD design §2.6). Best-effort: a failed
      # release-create must not flip the run red (the build+test above
      # is the gate; the tag exists regardless).
      - name: Create GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists - nothing to do"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "$TAG"

      # ── Consumer fan-out (gated - invariant) ─────────────────
      # GITHUB_TOKEN cannot trigger cross-repo runs; the App token can.
      # Both secrets must be non-empty or the step skips gracefully.
      # NOTE: the `secrets` context is NOT available inside step `if:`
      # conditions - referencing it there fails workflow parsing at every
      # caller ("This run likely failed because of a workflow file issue",
      # zero jobs). The emptiness gate therefore reads through the step
      # environment instead: mint with `continue-on-error` (empty secrets
      # make the app-token action fail, which is captured and continues),
      # then fan out only when a token actually materialized. This keeps
      # the documented no-op contract: without the App secrets the release
      # still completes; only the cascade dispatch is skipped.
      - name: Mint cascade App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          # Mint for the SDK repo's OWNER org (not just this repo): the
          # fan-out dispatches into CONSUMER repos across 8 orgs, and an
          # installation token minted for one repo is scoped to that
          # installation - the owner param ties it to the org install
          # (all-repo access) so cross-org dispatch is authorized.
          owner: ${{ github.repository_owner }}
          permission-contents: write

      # Per-org cascade tokens: GitHub installation tokens are
      # per-installation, so the fan-out mints one token PER target org via
      # the action (the same mint the producing org's step uses - the
      # hand-rolled openssl JWT was rejected by the API even when
      # self-verified; the action's JWT is accepted).
      - name: Token for Sentin8
        id: tok-Sentin8
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: Sentin8
          permission-contents: write
      - name: Token for Bank8-dev
        id: tok-Bank8-dev
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: Bank8-dev
          permission-contents: write
      - name: Token for OpenFin8
        id: tok-OpenFin8
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: OpenFin8
          permission-contents: write
      - name: Token for Hotel8
        id: tok-Hotel8
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: Hotel8
          permission-contents: write
      - name: Token for Exchange8-dev
        id: tok-Exchange8-dev
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: Exchange8-dev
          permission-contents: write
      - name: Token for Trade8-dev
        id: tok-Trade8-dev
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: Trade8-dev
          permission-contents: write
      - name: Token for commerce8
        id: tok-commerce8
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: commerce8
          permission-contents: write
      - name: Token for Email8-dev
        id: tok-Email8-dev
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: Email8-dev
          permission-contents: write
      - name: Token for Health8
        id: tok-Health8
        if: ${{ steps.app-token.outputs.token != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          owner: Health8
          permission-contents: write

      - name: Fan out sdk-released dispatch to consumers
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          SDK_REPO: ${{ inputs.sdk-repo }}
          SDK_TAG: ${{ github.ref_name }}
          CONSUMER_MAP_URL: https://raw.githubusercontent.com/Sentin8/sentin8-ci/ci-v3/consumers.json
          TOK_SENTIN8: ${{ steps.tok-Sentin8.outputs.token }}
          TOK_BANK8DEV: ${{ steps.tok-Bank8-dev.outputs.token }}
          TOK_OPENFIN8: ${{ steps.tok-OpenFin8.outputs.token }}
          TOK_HOTEL8: ${{ steps.tok-Hotel8.outputs.token }}
          TOK_EXCHANGE8DEV: ${{ steps.tok-Exchange8-dev.outputs.token }}
          TOK_TRADE8DEV: ${{ steps.tok-Trade8-dev.outputs.token }}
          TOK_COMMERCE8: ${{ steps.tok-commerce8.outputs.token }}
          TOK_EMAIL8DEV: ${{ steps.tok-Email8-dev.outputs.token }}
          TOK_HEALTH8: ${{ steps.tok-Health8.outputs.token }}
        run: |
          set -euo pipefail
          map="$(curl -fsSL "$CONSUMER_MAP_URL")"
          repos="$(printf '%s' "$map" | python3 -c "import json,sys; sdk=sys.argv[1]; m=json.load(sys.stdin); print('\n'.join(m.get(sdk, [])))" "$SDK_REPO")"
          if [ -z "$repos" ]; then
            echo "no consumers declared for $SDK_REPO - dispatch done"
            exit 0
          fi
          token_for() {
            case "$1" in
              Sentin8) echo "$TOK_SENTIN8" ;;
              Bank8-dev) echo "$TOK_BANK8DEV" ;;
              OpenFin8) echo "$TOK_OPENFIN8" ;;
              Hotel8) echo "$TOK_HOTEL8" ;;
              Exchange8-dev) echo "$TOK_EXCHANGE8DEV" ;;
              Trade8-dev) echo "$TOK_TRADE8DEV" ;;
              commerce8) echo "$TOK_COMMERCE8" ;;
              Email8-dev) echo "$TOK_EMAIL8DEV" ;;
              Health8) echo "$TOK_HEALTH8" ;;
              *) return 1 ;;
            esac
          }
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            org="${repo%%/*}"
            ORG_TOKEN="$(token_for "$org")" || { echo "no token for org $org - skip"; continue; }
            if [ -z "$ORG_TOKEN" ]; then echo "org $org token empty - skip $repo"; continue; fi
            echo "dispatch to $repo (sdk-released: $SDK_REPO $SDK_TAG)"
            payload_sdk="$(printf '%s' "$SDK_REPO" | sed 's|/|__|g')"
            GH_TOKEN="$ORG_TOKEN" gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$repo/dispatches" \
              -f event_type='sdk-released' \
              -f "client_payload[sdk]=$payload_sdk" \
              -f "client_payload[tag]=$SDK_TAG" \
              && echo "  dispatched" \
              || echo "  FAILED (continuing - cascade is best-effort per repo)"
          done <<< "$repos"