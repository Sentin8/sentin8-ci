# sdk-release.yml — SDK tag-push release lane (CICD design §2.2).
#
# Called by every SDK-repo caller (`release.yml`) on its tag prefix
# (sdk-v*, cron-sdk-v*, bank8-v*, …). Builds the tagged commit, then —
# only when the cascade GitHub App secrets are present — fans out a
# repository_dispatch to every consumer repo named in consumers.json.
# Without the App secrets the dispatch step is a documented no-op: the
# cascade is armed the day the operator creates the App (design §2.2,
# invariant CICD-5).

name: sdk-release

on:
  workflow_call:
    inputs:
      # The SDK's full repo slug (e.g. `Sentin8/sentin8-sdk`). The bump
      # receiver rewrites EVERY pin line pointing at this repo (a
      # pinned workspace exports many crates under one tag).
      sdk-repo:
        description: 'SDK repository slug (owner/name)'
        required: true
        type: string
    secrets:
      SENTIN8_CI_APP_ID:
        description: 'Cascade GitHub App ID (empty = dispatch skipped)'
        required: false
      SENTIN8_CI_APP_PRIVATE_KEY:
        description: 'Cascade GitHub App private key (empty = dispatch skipped)'
        required: false

permissions:
  contents: read

env:
  SQLX_OFFLINE: 'true'

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout (tagged commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v7.0.1

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      - name: Build + test the tagged release
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked

      # ── Consumer fan-out (gated — invariant CICD-5) ─────────────────
      # GITHUB_TOKEN cannot trigger cross-repo runs; the App token can.
      # Both secrets must be non-empty or the step skips gracefully.
      - name: Mint cascade App token
        id: app-token
        if: ${{ secrets.SENTIN8_CI_APP_ID != '' && secrets.SENTIN8_CI_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SENTIN8_CI_APP_ID }}
          private-key: ${{ secrets.SENTIN8_CI_APP_PRIVATE_KEY }}
          # Token is minted for THIS repository; the dispatch API call
          # needs contents:write on the TARGET repos — the App's install
          # must grant it per org (design §2.5 rollout step 7).
          permission-contents: write

      - name: Fan out sdk-released dispatch to consumers
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_REPO: ${{ inputs.sdk-repo }}
          SDK_TAG: ${{ github.ref_name }}
          # The consumer map lives in this repo at the ci-v1 ref the
          # caller itself pins — one source of truth for the graph.
          CONSUMER_MAP_URL: https://raw.githubusercontent.com/Sentin8/sentin8-ci/ci-v1/consumers.json
        run: |
          set -euo pipefail
          map="$(curl -fsSL "$CONSUMER_MAP_URL")"
          repos="$(printf '%s' "$map" | python3 -c '
            import json, sys
            sdk = sys.argv[1]
            m = json.load(sys.stdin)
            print("\n".join(m.get(sdk, [])))
          ' "$SDK_REPO")"
          if [ -z "$repos" ]; then
            echo "no consumers declared for $SDK_REPO — dispatch done"
            exit 0
          fi
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            echo "dispatch → $repo (sdk-released: $SDK_REPO $SDK_TAG)"
            # The payload carries the SDK repo slug with slashes
            # replaced (client_payload tolerates it; receivers undo
            # the substitution — see sdk-bump.yml).
            payload_sdk="$(printf '%s' "$SDK_REPO" | sed 's|/|__|g')"
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$repo/dispatches" \
              -f event_type='sdk-released' \
              -f "client_payload[sdk]=$payload_sdk" \
              -f "client_payload[tag]=$SDK_TAG" \
              && echo "  dispatched" \
              || echo "  FAILED (continuing — cascade is best-effort per repo)"
          done <<< "$repos"