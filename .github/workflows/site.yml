# site.yml - reusable website lane for the 8 public site repos
# (design/sentin8-websites-design.md §6). Build: harvest → build → deploy to
# GitHub Pages. The harvest step resolves unit docs from the sibling repos'
# public main branches (raw.githubusercontent.com), so the deployed site
# renders exactly what the public repos show.
#
# Caller contract (thin, like every other lane):
#   jobs:
#     ci:
#       uses: Sentin8/sentin8-ci/.github/workflows/site.yml@ci-v1
#       with:
#         site-dir: .            # optional; default repo root
#       permissions:
#         contents: read
#         pages: write
#         id-token: write

name: site-ci

on:
  workflow_call:
    inputs:
      site-dir:
        description: 'Directory holding the Docusaurus site (site.json)'
        required: false
        default: '.'
        type: string
      deploy:
        description: 'Deploy to GitHub Pages (false = build check only, e.g. PRs)'
        required: false
        default: true
        type: boolean

# Deploy job needs Pages write; the harvest step itself is read-only.
permissions:
  contents: read

jobs:
  build:
    name: harvest + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ inputs.site-dir }}/package-lock.json

      - name: Install
        working-directory: ${{ inputs.site-dir }}
        run: npm ci

      - name: Harvest reference docs
        working-directory: ${{ inputs.site-dir }}
        run: npm run harvest

      - name: Build
        working-directory: ${{ inputs.site-dir }}
        run: npm run build

      - name: Upload Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.site-dir }}/build

  deploy:
    if: inputs.deploy
    name: deploy (GitHub Pages)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: config
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1