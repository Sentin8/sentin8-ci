# ci.yml - this repo's own pipeline: validate every workflow file and
# the sync script's own templates (self-check lane; DESIGN §9).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v7.0.1

      - name: Parse + SHA-audit every workflow (scripts/lint-workflows.py)
        run: make lint

      - name: Compile-check the scripts
        run: python3 -m py_compile scripts/sync-ci.py scripts/lint-workflows.py